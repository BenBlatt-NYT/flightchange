name: Track flights

on:
  schedule:
    # Every 5 minutes (UTC). Offset from :00 to avoid peak load delays.
    - cron: "3/5 * * * *"
  workflow_dispatch:

concurrency:
  group: track-flights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python run.py --once --csv data/aug11-morning.csv

      - name: Commit price updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/aug11-morning.csv
          if git diff --staged --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git commit -m "Update flight prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
