name: Flight tracker (international)

on:
  # Separate cron-job.org workflow_dispatch from the domestic tracker.
  workflow_dispatch:

concurrency:
  group: flight-tracker-intl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python run.py --once --config config/watches-intl.yaml --csv data/routes-sep16-intl.csv

      - name: Export chart CSVs
        run: python export_charts.py --csv data/routes-sep16-intl.csv --output-dir data/charts-intl

      - name: Commit price updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/routes-sep16-intl.csv data/charts-intl/
          if git diff --staged --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git commit -m "Update international flight prices $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i); retrying..."
            sleep 15
          done
          echo "Could not push after retries."
          exit 1
