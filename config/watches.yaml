poll_interval_minutes: 10
request_delay_seconds: 8

# Domestic: 17 airport pairs × 2 directions = 34 searches (pre-noon).
# International: 8 one-way US→Europe searches (all day, Sep 16 2026).
# GitHub Actions runs --once (cron-job.org ~every 10 min). poll_interval
# only applies to local run_forever. Sleep between searches is 8s, so
# 41 gaps × 8s ≈ 5.5 min of delay plus HTTP time.

watches:
  # --- pairs that had 4-way lowest-price ties ---
  - id: den-lax-sep16
    route_name: DEN-LAX
    origin: DEN
    destination: LAX
    departure_date: "2026-09-16"
    record_all_flights: true
    depart_before_hour: 12
    include_airlines: [Delta, United, American, JetBlue, Alaska]
    direct_only: true
    adults: 1
    max_stops: none
    sort: price
    limit: 100

