poll_interval_minutes: 10
request_delay_seconds: 8

# 17 airport pairs × 2 directions = 34 searches per cycle.
# Nonstops departing before noon local, Sep 16 2026.
# Airlines: Delta, United, American, JetBlue, Alaska.
#
# With ~8s between requests, a full cycle is ~6–8 minutes, so 5-minute
# polling would overlap. 10 minutes is the minimum comfortable interval;
# bump to 15 if you start seeing 429s or stacked Actions runs.

watches:
  # --- pairs that had 4-way lowest-price ties ---
  - id: den-lax-sep16
    route_name: DEN-LAX
    origin: DEN
    destination: LAX
    departure_date: "2026-09-16"
    record_all_flights: true
    depart_before_hour: 12
    include_airlines: [Delta, United, American, JetBlue, Alaska]
    direct_only: true
    adults: 1
    max_stops: none
    sort: price
    limit: 100

